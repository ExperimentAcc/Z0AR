name: Unzip Workflows

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip archives and move workflows
        run: |
          mkdir -p .github/workflows
          mkdir -p extracted_temp

          # Find and unzip all .zip files in the repository
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d extracted_temp \;

          # Move extracted .yml/.yaml files into .github/workflows/
          find extracted_temp -type f \( -name "*.yml" -o -name "*.yaml" \) -exec mv {} .github/workflows/ \;

          # Clean up temporary folder and original zip files (optional: remove 'rm' line to keep zips)
          rm -rf extracted_temp
          find . -maxdepth 2 -name "*.zip" -delete

      - name: Commit and push extracted workflows
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Extract workflow .yml files from zip" && git push)
