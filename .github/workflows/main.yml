name: Unzip ZeroAccelerator-v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip file to root and cleanup
        run: |
          if [ -f "ZeroAccelerator-v2.zip" ]; then
            unzip -o ZeroAccelerator-v2.zip -d .
            rm ZeroAccelerator-v2.zip
          else
            echo "ZeroAccelerator-v2.zip not found in root."
            exit 1
          fi

      - name: Commit and push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract ZeroAccelerator-v2.zip to root"
            git push
          else
            echo "No changes to commit."
          fi
