name: Build ZERO ACCELERATOR APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK; just make sure the pieces we need exist.
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Build debug + release
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Sign release APK (dev keystore)
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore -alias zero \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Zero Accelerator"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks release.keystore --ks-key-alias zero \
            --ks-pass pass:android --key-pass pass:android \
            --out zero-accelerator-release.apk app-release-aligned.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: zero-accelerator-apk
          path: |
            zero-accelerator-release.apk
            app/build/outputs/apk/debug/app-debug.apk
