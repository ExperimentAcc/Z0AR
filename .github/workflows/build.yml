name: Build ZERO ACCELERATOR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4
      - run: gradle wrapper --gradle-version 8.4
      - run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK (dev keystore)
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore -alias zero \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Zero Accelerator"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks release.keystore --ks-key-alias zero \
            --ks-pass pass:android --key-pass pass:android \
            --out app-release-signed.apk app-release-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zero-accelerator-apk
          path: app-release-signed.apk
