name: Update Gradle Wrapper

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write # Required so the action can push the updated wrapper files back to your repo

jobs:
  update-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Gradle 8.4 works best with Java 17 or 21
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Update Gradle Wrapper to 8.4
        run: ./gradlew wrapper --gradle-version 8.4

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
          git diff --staged --quiet || (git commit -m "chore: update Gradle wrapper to 8.4" && git push)
